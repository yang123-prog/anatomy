<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Anatomy - 3D Human Anatomy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#0a0a0a;color:#e0e0e0}
#app{display:flex;width:100%;height:100%}
#sidebar{width:260px;background:#111;border-right:1px solid #222;overflow-y:auto}
#sidebar h1{padding:24px 20px 16px;font-size:18px;font-weight:600;border-bottom:1px solid #222;color:#fff}
#organ-list{list-style:none;padding:0}
#organ-list li{padding:14px 20px;cursor:pointer;border-left:3px solid transparent;font-size:14px;color:#999;display:flex;align-items:center;gap:10px;transition:all .15s}
#organ-list li:hover{background:#1a1a1a;color:#fff}
#organ-list li.active{background:#1a1a1a;color:#fff;border-left-color:#4a9eff}
#organ-list li .dot{width:8px;height:8px;border-radius:50%;background:#333}
#organ-list li.active .dot{background:#4a9eff}
#viewport{flex:1;position:relative}
#msg{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#aaa;padding:8px 16px;border-radius:6px;font-size:13px;z-index:10}
</style></head>
<body>
<div id="app"><div id="sidebar"><h1>Human Anatomy</h1><ul id="organ-list"></ul></div><div id="viewport"><div id="msg">Loading...</div></div></div>
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.0/build/three.module.js","three/examples/jsm/":"https://esm.sh/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
const msg=document.getElementById("msg");function log(m){msg.textContent=m;console.log(m)}

const organs=[
  {key:"skin",name:"Skin",emoji:"🧍",color:0xd4a574},
  {key:"brain",name:"Brain",emoji:"🧠",color:0xe8a0b0},
  {key:"eyeball",name:"Eyeball",emoji:"👁",color:0xffffff},
  {key:"heart",name:"Heart",emoji:"🫀",color:0xcc3333},
  {key:"lungs",name:"Lungs",emoji:"🫁",color:0xff9999},
  {key:"liver",name:"Liver",emoji:"🧫",color:0x8b5a2b},
  {key:"kidneys",name:"Kidneys",emoji:"🫘",color:0xcc5555},
  {key:"pancreas",name:"Pancreas",emoji:"🧬",color:0xddaa77},
  {key:"intestine",name:"Intestine",emoji:"🔬",color:0xcc8866},
];
const parts={
  skin:function(skin){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(.32,24,18),skin)).position.y=1.3;
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,.18,16),skin)).position.y=1.0;
    const torso=new THREE.Mesh(new THREE.CylinderGeometry(.3,.25,.85,16),skin);torso.position.y=.4;g.add(torso);
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(.09,.07,.55,12),skin)).position.set(-.42,.5,0);
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(.09,.07,.55,12),skin)).position.set(.42,.5,0);
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(.11,.09,.65,12),skin)).position.set(-.16,-.5,0);
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(.11,.09,.65,12),skin)).position.set(.16,-.5,0);
    return g;},
  brain:function(){const m=new THREE.Mesh(new THREE.SphereGeometry(.2,24,18),new THREE.MeshStandardMaterial({color:0xe8a0b0,roughness:.4}));m.position.set(0,1.3,.22);return m;},
  eyeball:function(){const g=new THREE.Group();const e=new THREE.Mesh(new THREE.SphereGeometry(.07,12,10),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.1}));e.position.set(.12,1.2,.3);g.add(e);g.add(e.clone()).position.set(-.12,1.2,.3);return g;},
  heart:function(){const m=new THREE.Mesh(new THREE.SphereGeometry(.14,16,12),new THREE.MeshStandardMaterial({color:0xcc3333,roughness:.4}));m.position.set(.04,.75,.25);return m;},
  lungs:function(){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.3,10),new THREE.MeshStandardMaterial({color:0xff9999,roughness:.5}));m.position.set(-.12,.6,.22);g.add(m);g.add(m.clone()).position.set(.2,.6,.22);return g;},
  liver:function(){const m=new THREE.Mesh(new THREE.BoxGeometry(.2,.15,.25),new THREE.MeshStandardMaterial({color:0x8b5a2b,roughness:.5}));m.position.set(.08,.4,.25);return m;},
  kidneys:function(){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.SphereGeometry(.1,12,10),new THREE.MeshStandardMaterial({color:0xcc5555,roughness:.4}));m.position.set(-.1,.22,.22);g.add(m);g.add(m.clone()).position.set(.2,.22,.22);return g;},
  pancreas:function(){const m=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.25,8),new THREE.MeshStandardMaterial({color:0xddaa77,roughness:.5}));m.position.set(.06,.28,.22);m.rotation.z=.3;return m;},
  intestine:function(){const m=new THREE.Mesh(new THREE.TorusGeometry(.18,.05,8,20),new THREE.MeshStandardMaterial({color:0xcc8866,roughness:.5}));m.position.set(0,.08,.22);return m;}
};

try{
  log("Loading Three.js...");
  const THREE=await import("three");
  const {OrbitControls}=await import("three/examples/jsm/controls/OrbitControls.js");
  log("Building...");
  
  const vp=document.getElementById("viewport");
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a1a2e);
  const camera=new THREE.PerspectiveCamera(45,vp.clientWidth/vp.clientHeight,.1,100);camera.position.set(1.5,1.3,3.5);
  const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(vp.clientWidth,vp.clientHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;vp.appendChild(renderer.domElement);
  
  scene.add(new THREE.AmbientLight(0x404060,3));
  const sun=new THREE.DirectionalLight(0xffffff,5);sun.position.set(3,5,4);scene.add(sun);
  scene.add(new THREE.DirectionalLight(0x4466aa,2)).position.set(-2,1,-1);
  
  const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.3,0);controls.update();
  window.addEventListener("resize",()=>{camera.aspect=vp.clientWidth/vp.clientHeight;camera.updateProjectionMatrix();renderer.setSize(vp.clientWidth,vp.clientHeight)});
  
  const list=document.getElementById("organ-list");
  organs.forEach(o=>{const li=document.createElement("li");li.innerHTML='<span class="dot"></span>'+o.emoji+' '+o.name;list.appendChild(li)});
  
  const skinMat=new THREE.MeshStandardMaterial({color:0xd4a574,roughness:.7});
  let current=null;
  
  document.querySelectorAll("#organ-list li").forEach((li,i)=>{
    li.addEventListener("click",()=>{
      document.querySelectorAll("#organ-list li").forEach(l=>l.classList.remove("active"));
      li.classList.add("active");
      if(current){scene.remove(current);current=null}
      log("Loading "+organs[i].name+"...");
      const g=new THREE.Group();
      g.add(parts.skin(skinMat));
      if(organs[i].key!=="skin"){const p=parts[organs[i].key]();if(p)g.add(p)}
      current=g;scene.add(current);
      log("");
      controls.target.set(0,.3,0);controls.update();
    });
  });
  
  const first=new THREE.Group();first.add(parts.skin(skinMat));current=first;scene.add(first);
  document.querySelector("#organ-list li:first-child").classList.add("active");
  log("");
  
  function animate(){requestAnimationFrame(animate);controls.update();if(current)current.rotation.y+=.005;renderer.render(scene,camera)}animate();
}catch(e){log("Error: "+e.message)}
</script></body></html>
