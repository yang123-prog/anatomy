<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Network Test</title></head>
<body style="background:#111;color:#fff;font:16px monospace;padding:30px">
<h1>Network Diagnostic</h1>
<div id="log"></div>
<script>
var log = document.getElementById("log");

function add(msg, cls) {
  var c = cls || "#888";
  log.innerHTML += '<div style="color:'+c+';margin:4px 0">'+msg+'</div>';
}

function testFetch(url, label) {
  add("Testing: " + label + "...", "#aaa");
  add("  URL: " + url, "#666");
  fetch(url, {method:"HEAD",mode:"cors"})
    .then(function(r) {
      add("  RESULT: HTTP " + r.status + " " + r.statusText + " (OK)", "#0f0");
      return r.headers.get("content-length");
    })
    .then(function(len) { if(len) add("  Size: " + len + " bytes", "#666"); })
    .catch(function(e) {
      add("  RESULT: FAILED - " + e.message, "#e55");
    });
}

add("1. Inline JS: OK (this message proves JS runs)", "#0f0");

setTimeout(function() {
  testFetch("https://yang123-prog.github.io/anatomy/models/skin.glb", "GitHub Pages - model");
  testFetch("https://raw.githubusercontent.com/yang123-prog/anatomy/main/models/skin.glb", "raw.githubusercontent - model");
  testFetch("https://raw.githubusercontent.com/yang123-prog/anatomy/main/lib/three.module.js", "raw.githubusercontent - three.js");
  testFetch("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "jsdelivr CDN - three.js");
}, 500);
</script>
</body></html>
