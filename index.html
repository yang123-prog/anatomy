<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy - 3D Human Anatomy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a0a;color:#e0e0e0}
#app{display:flex;width:100%;height:100%}
#sidebar{width:260px;min-width:260px;background:#111;border-right:1px solid #222;display:flex;flex-direction:column;overflow-y:auto}
#sidebar h1{padding:24px 20px 16px;font-size:18px;font-weight:600;border-bottom:1px solid #222;color:#fff}
#organ-list{list-style:none;padding:0}
#organ-list li{padding:14px 20px;cursor:pointer;transition:all .15s;border-left:3px solid transparent;font-size:14px;color:#999;display:flex;align-items:center;gap:10px}
#organ-list li:hover{background:#1a1a1a;color:#fff}
#organ-list li.active{background:#1a1a1a;color:#fff;border-left-color:#4a9eff}
#organ-list li .dot{width:8px;height:8px;border-radius:50%;background:#333;flex-shrink:0}
#organ-list li.active .dot{background:#4a9eff}
#viewport{flex:1;position:relative}
#debug{position:absolute;top:0;left:0;right:0;background:rgba(0,0,0,.9);color:#0f0;padding:12px;font-size:13px;z-index:100;font-family:monospace;max-height:50%;overflow-y:auto}
</style>
</head>
<body>
<div id="debug"></div>
<div id="app">
  <div id="sidebar"><h1>Human Anatomy</h1><ul id="organ-list"></ul></div>
  <div id="viewport"></div>
</div>

<script type="importmap">
{"imports":{"three":"https://esm.sh/three@0.160.0/build/three.module.js","three/addons/":"https://esm.sh/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
const dbg = document.getElementById("debug");
function log(m) { dbg.textContent += m + "\n"; console.log(m); }

try {
  log("URL: " + window.location.href);

  const THREE = await import("three");
  log("Three.js v" + (THREE.REVISION||"?"));

  const organs = [
    { key:"skin", name:"Skin", emoji:"🧍" },
    { key:"brain", name:"Brain", emoji:"🧠" },
    { key:"eyeball", name:"Eyeball", emoji:"👁" },
    { key:"heart", name:"Heart", emoji:"🫀" },
    { key:"lungs", name:"Lungs", emoji:"🫁" },
    { key:"liver", name:"Liver", emoji:"🧫" },
    { key:"kidneys", name:"Kidneys", emoji:"🫘" },
    { key:"pancreas", name:"Pancreas", emoji:"🧬" },
    { key:"intestine", name:"Intestine", emoji:"🔬" },
  ];

  // Build list
  const list = document.getElementById("organ-list");
  organs.forEach(o => {
    const li = document.createElement("li");
    li.innerHTML = '<span class="dot"></span>' + o.emoji + ' ' + o.name;
    list.appendChild(li);
  });

  // Base URL for models (absolute)
  const base = window.location.href.replace(/\/[^/]*$/, "/");
  log("Models base: " + base + "models/");

  // Setup scene
  const vp = document.getElementById("viewport");
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  const camera = new THREE.PerspectiveCamera(45, vp.clientWidth/vp.clientHeight, 0.1, 100);
  camera.position.set(3, 2, 5);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(vp.clientWidth, vp.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  vp.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0x404060, 4));
  const dl = new THREE.DirectionalLight(0xffffff, 5);
  dl.position.set(5, 8, 5);
  scene.add(dl);

  const {OrbitControls} = await import("three/addons/controls/OrbitControls.js");
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.target.set(0, 0.3, 0); controls.update();

  const {GLTFLoader} = await import("three/addons/loaders/GLTFLoader.js");
  const {DRACOLoader} = await import("three/addons/loaders/DRACOLoader.js");
  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath(base + "draco/");
  const gltfLoader = new GLTFLoader();
  gltfLoader.setDRACOLoader(dracoLoader);

  let currentModel = null;
  function loadOrgan(key, name) {
    if (currentModel) { scene.remove(currentModel); currentModel = null; }
    const url = base + "models/" + key + ".glb";
    log("Fetching: " + url);
    gltfLoader.load(url,
      (gltf) => {
        log("LOADED: " + name);
        currentModel = gltf.scene;
        const box = new THREE.Box3().setFromObject(currentModel);
        const c = new THREE.Vector3(); box.getCenter(c);
        currentModel.position.sub(c).add(new THREE.Vector3(0,0.2,0));
        const s = 2.5 / Math.max(...box.getSize(new THREE.Vector3()).toArray());
        currentModel.scale.setScalar(s);
        currentModel.traverse(ch => {
          if (ch.isMesh) { ch.material = ch.material.clone(); ch.material.metalness=0.05; ch.material.roughness=0.45; }
        });
        scene.add(currentModel);
        controls.target.set(0,0.2,0); controls.update();
      },
      (xhr) => { if (xhr.total) log(name + " " + Math.round(xhr.loaded/xhr.total*100) + "%"); },
      (err) => { log("FAIL: " + name + " - " + (err?.message||"unknown")); }
    );
  }

  document.querySelectorAll("#organ-list li").forEach((li,i) => {
    li.addEventListener("click", () => {
      document.querySelectorAll("#organ-list li").forEach(l=>l.classList.remove("active"));
      li.classList.add("active");
      loadOrgan(organs[i].key, organs[i].name);
    });
  });

  // Auto-load
  loadOrgan("skin", "Skin");
  document.querySelector("#organ-list li:first-child").classList.add("active");

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    if (currentModel) currentModel.rotation.y += 0.003;
    renderer.render(scene, camera);
  }
  animate();
  log("Renderer running");

} catch(e) {
  log("ERROR: " + e.message);
  console.error(e);
}
</script>
</body>
</html>
