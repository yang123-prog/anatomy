<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>Diagnostic</title></head>
<body style="background:#000;color:#fff;font-family:monospace;padding:30px;font-size:18px">
<h1 style="color:#0f0">✅ Test Page</h1>
<p>If you see this green text, GitHub Pages is working.</p>
<hr>
<div id="tests"></div>
<script>
var t = document.getElementById("tests");
function show(msg, pass) {
  t.innerHTML += '<p style="color:'+(pass?'#0f0':'#e55')+'">' + msg + '</p>';
}
show("1. HTML rendered", true);

// Test script loading
show("2. JavaScript running", true);

// Test canvas/WebGL
var c = document.createElement("canvas");
var gl = c.getContext("webgl2") || c.getContext("webgl");
show("3. WebGL: " + (gl ? "YES" : "NO"), !!gl);

// Test dynamic script loading
var s = document.createElement("script");
s.src = "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js";
s.onload = function() {
  show("4. Three.js loaded (global): " + (typeof THREE !== "undefined" ? "YES" : "NO"), typeof THREE !== "undefined");
  
  // Try renderer
  if (typeof THREE !== "undefined") {
    try {
      var r = new THREE.WebGLRenderer({canvas:c});
      r.setSize(100,100);
      var sc = new THREE.Scene();
      sc.background = new THREE.Color(0x006600);
      var cam = new THREE.PerspectiveCamera(45,1,0.1,100);
      cam.position.z = 2;
      r.render(sc, cam);
      document.body.appendChild(r.domElement);
      show("5. Three.js WebGL render: OK (green box above)", true);
      
      // Test model URL
      var xhr = new XMLHttpRequest();
      xhr.open("HEAD", "https://cdn.jsdelivr.net/gh/yang123-prog/anatomy@main/models/skin.glb");
      xhr.onload = function() {
        show("6. jsdelivr CDN model: HTTP " + xhr.status + " (" + xhr.getResponseHeader("content-length") + " bytes)", xhr.status === 200);
        if (xhr.status === 200) show("✅ ALL TESTS PASSED - models should load!", true);
        else show("❌ CDN model not accessible", false);
      };
      xhr.onerror = function() { show("6. jsdelivr CDN: NETWORK ERROR", false); };
      xhr.send();
    } catch(e) {
      show("5. Three.js render: " + e.message, false);
    }
  }
};
s.onerror = function() { show("4. Three.js: FAILED TO LOAD", false); };
document.head.appendChild(s);
</script>
</body>
</html>
