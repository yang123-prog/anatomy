<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy - 3D Human Anatomy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#0a0a0a;color:#e0e0e0}
#app{display:flex;width:100%;height:100%}
#sidebar{width:260px;min-width:260px;background:#111;border-right:1px solid #222;overflow-y:auto;z-index:1}
#sidebar h1{padding:24px 20px 16px;font-size:18px;font-weight:600;border-bottom:1px solid #222;color:#fff}
#organ-list{list-style:none;padding:0}
#organ-list li{padding:14px 20px;cursor:pointer;transition:all .15s;border-left:3px solid transparent;font-size:14px;color:#999;display:flex;align-items:center;gap:10px}
#organ-list li:hover{background:#1a1a1a;color:#fff}
#organ-list li.active{background:#1a1a1a;color:#fff;border-left-color:#4a9eff}
#organ-list li .dot{width:8px;height:8px;border-radius:50%;background:#333}
#organ-list li.active .dot{background:#4a9eff}
#viewer-wrap{flex:1;position:relative;background:#1a1a2e}
model-viewer{width:100%;height:100%}
#status{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#aaa;padding:8px 16px;border-radius:6px;font-size:13px;z-index:10;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar"><h1>Human Anatomy</h1><ul id="organ-list"></ul></div>
  <div id="viewer-wrap">
    <model-viewer id="viewer" camera-controls auto-rotate interaction-prompt="none" exposure="1.2" shadow-intensity="0.5" environment-image="neutral"></model-viewer>
    <div id="status">Loading...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@google/model-viewer@1.12.1/dist/model-viewer.min.js"></script>

<script>
(function() {
  var BASE = "https://raw.githubusercontent.com/yang123-prog/anatomy/main/";
  var st = document.getElementById("status");
  var viewer = document.getElementById("viewer");

  var organs = [
    { key:"skin", name:"Skin", emoji:"🧍" },{ key:"brain", name:"Brain", emoji:"🧠" },
    { key:"eyeball", name:"Eyeball", emoji:"👁" },{ key:"heart", name:"Heart", emoji:"🫀" },
    { key:"lungs", name:"Lungs", emoji:"🫁" },{ key:"liver", name:"Liver", emoji:"🧫" },
    { key:"kidneys", name:"Kidneys", emoji:"🫘" },{ key:"pancreas", name:"Pancreas", emoji:"🧬" },
    { key:"intestine", name:"Intestine", emoji:"🔬" },
  ];

  var list = document.getElementById("organ-list");
  organs.forEach(function(o) {
    var li = document.createElement("li");
    li.innerHTML = '<span class="dot"></span>' + o.emoji + ' ' + o.name;
    li.onclick = function() {
      document.querySelectorAll("#organ-list li").forEach(function(l) { l.classList.remove("active"); });
      li.classList.add("active");
      st.textContent = "Loading " + o.name + "...";
      viewer.src = BASE + "models/" + o.key + ".glb";
    };
    list.appendChild(li);
  });

  viewer.addEventListener("load", function() { st.textContent = ""; });
  viewer.addEventListener("progress", function(e) {
    if (e.detail.totalProgress < 1) st.textContent = "Loading " + Math.round(e.detail.totalProgress*100) + "%";
  });
  viewer.addEventListener("error", function(e) {
    st.textContent = "Failed to load model";
  });

  st.textContent = "Loading Skin...";
  viewer.src = BASE + "models/skin.glb";
  document.querySelector("#organ-list li:first-child").classList.add("active");
})();
</script>
</body>
</html>
